<rect class="bg" x="0" y="0" width="1420" height="820"/>

<text class="th" x="30" y="34">TF-09 — Pen-switching loop · Grasshopper canvas layout</text>
<text class="tw" x="30" y="54">DIAGRAM — this is a drawing of what to connect, not a screenshot of a built definition.</text>

<!-- ============ LEFT ============ -->
<text class="tb" x="34" y="92">inputs</text>

<rect class="par"  x="30" y="104" width="200" height="46" rx="4"/>
<text class="tb"   x="40" y="122">Curve param (list)</text>
<text class="ts"   x="40" y="138">the strokes → curves</text>

<rect class="par"  x="30" y="158" width="200" height="46" rx="4"/>
<text class="tb"   x="40" y="176">int list  →  penIds</text>
<text class="ts"   x="40" y="192">one pen number per curve</text>

<rect class="par"  x="30" y="212" width="200" height="60" rx="4"/>
<text class="tb"   x="40" y="230">Plane  →  drawPlane</text>
<text class="ts"   x="40" y="246">the plane of the paper</text>
<text class="ts"   x="40" y="262">flat, tilted or vertical — all fine</text>

<rect class="par"  x="30" y="280" width="200" height="60" rx="4"/>
<text class="tb"   x="40" y="298">Plane list → slotPlanes</text>
<text class="ts"   x="40" y="314">one plane per magazine slot</text>
<text class="ts"   x="40" y="330">planes, not heights</text>

<rect class="par"  x="30" y="348" width="200" height="46" rx="4"/>
<text class="tb"   x="40" y="366">Plane → homePlane</text>
<text class="ts"   x="40" y="382">start and end of the job</text>

<rect class="slid" x="30" y="402" width="200" height="86" rx="4"/>
<text class="tb"   x="40" y="420">Number Sliders — all optional</text>
<text class="ts"   x="40" y="436">leadIn 0–50 · leadOut 0–50</text>
<text class="ts"   x="40" y="451">hover 5–100 · pressDepth 0–10</text>
<text class="ts"   x="40" y="466">tiltDeg · resolution · startIndex</text>
<text class="ts"   x="40" y="481">feedDraw · feedRapid · swapSeconds</text>

<rect class="tog"  x="30" y="496" width="200" height="60" rx="4"/>
<text class="tb"   x="40" y="514">Boolean Toggles — required</text>
<text class="ts"   x="40" y="530">optimize · groupByPen</text>
<text class="ts"   x="40" y="546">not optional on purpose</text>

<rect class="togr" x="30" y="564" width="200" height="72" rx="4"/>
<text class="tb"   x="40" y="582">Boolean Toggle — liveRun</text>
<text class="ts"   x="40" y="598">LEAVE IT OFF</text>
<text class="ts"   x="40" y="613">unwired = false = dry run</text>
<text class="ts"   x="40" y="628">the unsafe option is opt-in</text>

<rect class="tog"  x="30" y="646" width="200" height="42" rx="4"/>
<text class="tb"   x="40" y="664">selfTest toggle</text>
<text class="ts"   x="40" y="680">orientation proof, slow</text>

<rect class="slid" x="30" y="696" width="200" height="72" rx="4"/>
<text class="tb"   x="40" y="714">Integer sliders — KUKA bases</text>
<text class="ts"   x="40" y="730">baseIndex 1–4 · the paper</text>
<text class="ts"   x="40" y="745">magBaseIndex 1–4 · magazine</text>
<text class="ts"   x="40" y="760">1 = worktable · 2 = large format</text>

