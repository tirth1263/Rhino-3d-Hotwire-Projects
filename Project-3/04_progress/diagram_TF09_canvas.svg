<!-- PEN_ENSURE explainer -->
<rect class="krl" x="1000" y="300" width="380" height="180" rx="6"/>
<text class="tb"  x="1014" y="322">The one door: PEN_ENSURE(n)</text>
<text class="ts"  x="1014" y="344">The generated job never says "park" or "acquire".</text>
<text class="ts"  x="1014" y="360">It says which pen it needs. PEN_ENSURE decides</text>
<text class="ts"  x="1014" y="376">whether that means nothing, a pick-up, or a park</text>
<text class="ts"  x="1014" y="392">first — then sets $TOOL.</text>
<text class="ts"  x="1014" y="414">One door means exactly one place in the system</text>
<text class="ts"  x="1014" y="430">where a pen can be half out of a slot, which is</text>
<text class="ts"  x="1014" y="446">what makes "what if it stops right now" a</text>
<text class="ts"  x="1014" y="462">question with an answer.</text>

<rect class="krl" x="1000" y="496" width="380" height="200" rx="6"/>
<text class="tb"  x="1014" y="518">Why abort is safe</text>
<text class="ts"  x="1014" y="540">The collet only ever changes state while the tool</text>
<text class="ts"  x="1014" y="556">is fully home in a slot. Never in mid-air, never</text>
<text class="ts"  x="1014" y="572">while moving, never at the approach pose.</text>
<text class="ts"  x="1014" y="594">So at every instant the pen is fully in its slot</text>
<text class="ts"  x="1014" y="610">or fully in the gripper. Nothing can drop it.</text>
<text class="ts"  x="1014" y="632">PEN_PHASE (9 values) is written to the persistent</text>
<text class="ts"  x="1014" y="648">DAT around every irreversible step, so after any</text>
<text class="ts"  x="1014" y="664">stop the controller knows which half-finished</text>
<text class="ts"  x="1014" y="680">action to complete. One branch per phase.</text>

<text class="tw" x="30" y="784">Native Grasshopper and C# only. No Python. liveRun stays OFF until the T1 dry run has passed.</text>
</svg>
