<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 780" width="1420" height="780" font-family="Segoe UI, Arial, sans-serif">
<style>
  .bg   { fill:#f7f7f4; }
  .th   { font-size:17px; fill:#1c1c1c; font-weight:700; }
  .tb   { font-size:13.5px; fill:#1c1c1c; font-weight:600; }
  .t    { font-size:12.5px; fill:#1c1c1c; }
  .ts   { font-size:11.5px; fill:#555; }
  .tw   { font-size:11.5px; fill:#7a3030; font-style:italic; }
  .bad  { fill:#fdeaea; stroke:#a83232; stroke-width:1.8; }
  .good { fill:#eaf5ea; stroke:#3f8f4f; stroke-width:1.8; }
  .box  { fill:#ffffff; stroke:#999; stroke-width:1.3; }
  .part { fill:#d8dee8; stroke:#4a5a70; stroke-width:1.6; }
  .slice{ stroke:#b58900; stroke-width:1.6; fill:none; }
  .axL  { stroke:#c0392b; stroke-width:2.6; fill:none; }
  .axM  { stroke:#27794a; stroke-width:2.2; fill:none; }
  .wax  { stroke:#8a8a8a; stroke-width:1.4; stroke-dasharray:4 3; fill:none; }
</style>
<defs>
  <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 z" fill="#c0392b"/>
  </marker>
  <marker id="ag" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 z" fill="#27794a"/>
  </marker>
  <marker id="aw" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
    <path d="M0,0 L7,3 L0,6 z" fill="#8a8a8a"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="1420" height="780"/>

<text class="th" x="30" y="36">Why the toolpath works in any orientation</text>
<text class="tw" x="30" y="56">DIAGRAM — a drawing of the idea, not a screenshot.</text>

<!-- ================= ROW 1: the naive approach ================= -->
<rect class="bad" x="30" y="76" width="1360" height="286" rx="8"/>
<text class="tb" x="48" y="102">The usual way, and why it breaks</text>
<text class="t"  x="48" y="124">"Slice the model going up." Up means the world Z direction. It has nothing to do with the model.</text>

<!-- case A: model upright, works -->
<text class="tb" x="90" y="160">model modelled upright</text>
<line class="wax" x1="72" y1="330" x2="72" y2="180" marker-end="url(#aw)"/>
<text class="ts" x="56" y="174">world Z</text>
<path class="part" d="M120 330 L120 210 Q120 190 145 190 L185 190 Q210 190 210 210 L210 330 Z"/>
<line class="slice" x1="112" y1="215" x2="218" y2="215"/>
<line class="slice" x1="112" y1="245" x2="218" y2="245"/>
<line class="slice" x1="112" y1="275" x2="218" y2="275"/>
<line class="slice" x1="112" y1="305" x2="218" y2="305"/>
<text class="ts" x="112" y="350">slices cross the model. fine.</text>

<!-- case B: model on its side, breaks -->
<text class="tb" x="440" y="160">same model, modelled lying down</text>
<line class="wax" x1="422" y1="330" x2="422" y2="180" marker-end="url(#aw)"/>
<text class="ts" x="406" y="174">world Z</text>
<path class="part" d="M470 300 L590 300 Q610 300 610 275 L610 240 Q610 215 590 215 L470 215 Z"/>
<line class="slice" x1="490" y1="205" x2="490" y2="312"/>
<line class="slice" x1="520" y1="205" x2="520" y2="312"/>
<line class="slice" x1="550" y1="205" x2="550" y2="312"/>
<line class="slice" x1="580" y1="205" x2="580" y2="312"/>
<text class="ts" x="466" y="336">world Z still points up, so the slices now</text>
<text class="ts" x="466" y="352">run the wrong way through the part.</text>

<!-- consequence -->
<rect class="box" x="700" y="150" width="660" height="190" rx="6"/>
<text class="tb" x="716" y="174">What actually goes wrong</text>
<text class="t"  x="716" y="200">The slices are still geometrically valid. The preview still looks like a toolpath.</text>
<text class="t"  x="716" y="222">Nothing errors. Nothing turns orange.</text>
<text class="t"  x="716" y="252">You find out when the foam is cut, or when the pen draws the wrong thing.</text>
<text class="t"  x="716" y="282">This is the failure mode the requirement is really about: not a crash,</text>
<text class="t"  x="716" y="304">but a wrong answer that looks right.</text>

<!-- ================= ROW 2: our approach ================= -->
<rect class="good" x="30" y="382" width="1360" height="300" rx="8"/>
<text class="tb" x="48" y="408">What this project does instead</text>
<text class="t"  x="48" y="430">Work out the model's own directions from its own shape, then slice along those. Turn the model and they turn with it.</text>

<!-- case A -->
<text class="tb" x="90" y="462">upright</text>
<path class="part" d="M120 640 L120 520 Q120 500 145 500 L185 500 Q210 500 210 520 L210 640 Z"/>
<line class="axL" x1="165" y1="640" x2="165" y2="486" marker-end="url(#ar)"/>
<line class="axM" x1="165" y1="580" x2="238" y2="580" marker-end="url(#ag)"/>
<line class="slice" x1="112" y1="525" x2="218" y2="525"/>
<line class="slice" x1="112" y1="560" x2="218" y2="560"/>
<line class="slice" x1="112" y1="595" x2="218" y2="595"/>
<line class="slice" x1="112" y1="628" x2="218" y2="628"/>
<text class="ts" x="100" y="662">red = the model's longest direction</text>

<!-- case B -->
<text class="tb" x="330" y="462">lying down</text>
<path class="part" d="M320 610 L440 610 Q460 610 460 585 L460 550 Q460 525 440 525 L320 525 Z"/>
<line class="axL" x1="320" y1="567" x2="482" y2="567" marker-end="url(#ar)"/>
<line class="axM" x1="390" y1="567" x2="390" y2="494" marker-end="url(#ag)"/>
<line class="slice" x1="340" y1="516" x2="340" y2="620"/>
<line class="slice" x1="370" y1="516" x2="370" y2="620"/>
<line class="slice" x1="400" y1="516" x2="400" y2="620"/>
<line class="slice" x1="430" y1="516" x2="430" y2="620"/>
<text class="ts" x="316" y="662">the axes turned with the part</text>

<!-- case C -->
<text class="tb" x="560" y="462">at any angle</text>
<g transform="rotate(37 620 570)">
  <path class="part" d="M560 630 L560 510 Q560 490 585 490 L625 490 Q650 490 650 510 L650 630 Z"/>
  <line class="axL" x1="605" y1="630" x2="605" y2="476" marker-end="url(#ar)"/>
  <line class="axM" x1="605" y1="570" x2="678" y2="570" marker-end="url(#ag)"/>
  <line class="slice" x1="552" y1="515" x2="658" y2="515"/>
  <line class="slice" x1="552" y1="550" x2="658" y2="550"/>
  <line class="slice" x1="552" y1="585" x2="658" y2="585"/>
  <line class="slice" x1="552" y1="618" x2="658" y2="618"/>
</g>
<text class="ts" x="556" y="662">same toolpath, just rotated</text>

<!-- the method + proof -->
<rect class="box" x="760" y="450" width="290" height="212" rx="6"/>
<text class="tb" x="776" y="474">How the axes are found</text>
<text class="ts" x="776" y="498">1. take every triangle in the mesh</text>
<text class="ts" x="776" y="518">2. weight each by its area — a big</text>
<text class="ts" x="776" y="534">   triangle counts more than a sliver</text>
<text class="ts" x="776" y="554">3. find the direction the model is</text>
<text class="ts" x="776" y="570">   most spread out in. That is the</text>
<text class="ts" x="776" y="586">   long axis. Then the next. Then</text>
<text class="ts" x="776" y="602">   the last.</text>
<text class="ts" x="776" y="626">These belong to the model, so they</text>
<text class="ts" x="776" y="642">rotate exactly as the model does.</text>

<rect class="box" x="1076" y="450" width="290" height="212" rx="6"/>
<text class="tb" x="1092" y="474">How it is proved, not claimed</text>
<text class="ts" x="1092" y="498">Set selfTest = True. The component:</text>
<text class="ts" x="1092" y="518">· runs once and keeps the answer</text>
<text class="ts" x="1092" y="534">· rotates the model 8 times at random</text>
<text class="ts" x="1092" y="550">· re-runs the whole pipeline on each</text>
<text class="ts" x="1092" y="566">· rotates each answer back</text>
<text class="ts" x="1092" y="582">· measures the difference</text>
<text class="ts" x="1092" y="606">Drift comes out around 1e-9 mm and</text>
<text class="ts" x="1092" y="622">1e-9 degrees — the last digit a</text>
<text class="ts" x="1092" y="638">computer can hold. Same answer.</text>
<text class="tb" x="1092" y="658">RESULT: PASS</text>

<text class="tw" x="30" y="716">One honest caveat: a sphere, a cube or a plain cylinder genuinely has no unique "long direction", the way a circle has no unique top.</text>
<text class="tw" x="30" y="734">No maths can invent one. When that happens the component warns and the self-test reports FAIL — the code being honest, not broken.</text>
<text class="tw" x="30" y="752">The fix is one click: set axisMode = 5 and hand it the axis. Real parts with any asymmetry never hit this.</text>
</svg>
